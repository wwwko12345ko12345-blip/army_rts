name: Build PS2 ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools + gsKit
        run: |
          apk add --no-cache make cdrkit git || true
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=/usr/local/ps2dev/ps2sdk
          export PATH=$PATH:/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin
          cd /tmp
          rm -rf dmaKit gsKit
          git clone https://github.com/ps2dev/dmaKit.git
          cd dmaKit && make && make install && cd ..
          git clone https://github.com/ps2dev/gsKit.git
          cd gsKit && make && make install && cd ..
          ls /usr/local/ps2dev/ps2sdk/ee/include/gsKit.h && echo "gsKit OK"
      - name: Build ELF
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=/usr/local/ps2dev/ps2sdk
          export PATH=$PATH:/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin
          make
          ls -lh *.elf
      - name: Make ISO
        run: |
          mkdir -p iso
          cp army_rts.elf iso/SLUS_999.99
          cp SYSTEM.CNF iso/
          (mkisofs -o army_rts.iso -V "ARMY_RTS" -iso-level 4 iso/ || genisoimage -o army_rts.iso -V "ARMY_RTS" -iso-level 4 iso/)
          ls -lh *.iso
      - uses: actions/upload-artifact@v4
        with:
          name: army_rts-iso
          path: army_rts.iso
